<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Charismatique</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center,
                #ffffff 0%,
                #ffe4ec 30%,
                #ffb6c1 55%,
                #ff69b4 75%,
                #ffb6c1 100%
            );
        }

        /* CONTENEUR */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        h1 {
            font-size: 52px;
            margin-bottom: 30px;
            color: white;
            text-shadow:
                0 0 10px white,
                0 0 30px pink,
                0 0 60px hotpink;
        }

        /* IMAGE */
        .photo {
            max-width: 80vw;
            max-height: 65vh;
            border-radius: 20px;
            box-shadow:
                0 0 40px rgba(255,255,255,0.9),
                0 0 100px rgba(255,182,193,0.9),
                0 0 180px rgba(255,105,180,0.8);
            cursor: pointer;
        }

        /* MESSAGE D'AMOUR */
        #love-message {
            position: fixed;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            text-shadow:
                0 0 10px hotpink,
                0 0 30px deeppink,
                0 0 50px white;
            z-index: 10000;
            display: none;
            pointer-events: none;
        }

        /* PÉTALES AU PREMIER PLAN */
        .petal {
            position: fixed;
            top: -40px;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at top left, #fff, #ffb6c1, #ff69b4);
            border-radius: 50% 50% 50% 0;
            opacity: 0.85;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 9999;
        }

        @keyframes fall {
            from { transform: translateY(-50px) rotate(0deg); }
            to   { transform: translateY(120vh) rotate(360deg); }
        }
    </style>
</head>

<body>

    <!-- MESSAGE : caché au départ -->
    <div id="love-message">Je t'aime ma girafe 🦒❤️</div>

    <div class="container">
        <img src="Faux_autoportrait_Osrin-3°6.jpg"
             class="photo"
             id="photo"
             alt="romantique">
    </div>

    <audio id="music" loop>
        <source src="George_Michael_Careless_Whisper_Remastered_Ringtone_(by Fringster.com).mp3"
                type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById("music");
        const message = document.getElementById("love-message");

        let petalsInterval = null;
        let messageTimeout = null;
        let started = false;

        /* LANCEMENT APRÈS LE PREMIER CLIC N'IMPORTE OÙ */
        document.addEventListener("click", startAll, { once: true });

        function startAll() {
            // Afficher le message immédiatement
            message.style.display = "block";

            // Masquer le message après 3 secondes
            clearTimeout(messageTimeout);

            messageTimeout = setTimeout(() => {
                message.style.display = "none";
            }, 3000);

            // Lancer musique et pétales
            music.volume = 1;
            music.play().catch(() => {});

            startPetals();
            started = true;
        }

        /* STOP SI ON CHANGE D'ONGLET */
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                music.pause();
                stopPetals();
            } else if (started) {
                music.play().catch(() => {});
                startPetals();
            }
        });

        /* CRÉATION D'UN PÉTALE */
        function createPetal() {
            const p = document.createElement("div");
            p.className = "petal";
            p.style.left = Math.random() * 100 + "vw";
            p.style.animationDuration = 6 + Math.random() * 5 + "s";
            p.style.transform = `scale(${0.6 + Math.random()})`;

            document.body.appendChild(p);

            setTimeout(() => p.remove(), 12000);
        }

        /* DÉMARRER LA PLUIE DE PÉTALES */
        function startPetals() {
            if (petalsInterval) return;

            /* Pluie instantanée au démarrage */
            for (let i = 0; i < 20; i++) {
                createPetal();
            }

            /* Pluie continue */
            petalsInterval = setInterval(createPetal, 150);
        }

        /* STOP */
        function stopPetals() {
            clearInterval(petalsInterval);
            petalsInterval = null;
        }
    </script>

</body>
</html>
